<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Visualization</title>
    <link rel="stylesheet" href="index.css" />
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  </head>
  <body>
    <div class="table_style">
      <div>
        <label for="addStudent">Add Student:</label>
        <input type="button" value="+" id="addStudent" />
      </div>

      <table id="studentTable">
        <thead>
          <tr>
            <th>Student ID</th>
            <th>Student Name</th>
            <th>First Language</th>
            <th>Second Language</th>
            <th>English</th>
            <th>Mathematics</th>
            <th>Social Sciences</th>
            <th>Physical Sciences</th>
            <th>Graphs | Charts | Remove</th>
          </tr>
        </thead>
        <tbody>
          <!-- checked Getting object data here and table getting displayed ---------------------------- -->
        </tbody>
      </table>
    </div>

    <div id="stuAddPopup" class="student-popup">
      <h3 style="display: inline; margin-bottom: 10px;">Enter Student Details & Marks</h3> 
      <span style="float: right;cursor: pointer;" id="closeAddBtn">&times;</span>
      <form id="form" class="">
      <div class="stylemodalInput">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" required/>
      </div>
      <div class="stylemodalInput">
        <label for="firstlang">Ist Language:</label>
        <input type="number" id="firstlang" required />
      </div>
      <div class="stylemodalInput">
        <label for="secondlang">IInd Language</label>
        <input type="number" id="secondlang" required/>
      </div>
      <div class="stylemodalInput">
        <label for="englishValue">English:</label>
        <input type="number" id="engilshValue" required/>
      </div>
      <div class="stylemodalInput">
        <label for="mathsValue">Mathematics:</label>
        <input type="number" id="mathsValue" required/>
      </div>
      <div class="stylemodalInput">
        <label for="socialValue">Social Sciences:</label>
        <input type="number" id="socialValue" required/>
      </div>
      <div class="stylemodalInput">
        <label for="physicsValue">Physical Sciences:</label>
        <input type="number" id="physicsValue" required/>
      </div>
           <input type="submit" value="Add"/>
        </form>
      </div>
    </div>

    <div  style="width:100%;max-width:700px">
      <canvas id="studentPlot"></canvas>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
